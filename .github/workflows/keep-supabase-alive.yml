name: Keep Supabase project alive

# Supabase pausa los proyectos del plan gratuito tras ~7 dias sin actividad
# en la base de datos. Como este sitio es estatico (GitHub Pages) no hay un
# servidor que haga el "ping", asi que lo hace este workflow: una vez al dia
# ejecuta una consulta minima contra la API REST de Supabase, equivalente al
# `select('id').limit(1)` que hace el cron de hipoteca-app.

on:
  schedule:
    - cron: "0 12 * * *" # todos los dias 12:00 UTC
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a la API REST de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP status: $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::La consulta a Supabase fallo con status $status"
            exit 1
          fi
